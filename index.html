<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11102b">
  <title>Make a wish</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main class="page entrance">
    <h1 id="title"></h1>
    <p class="lede" id="lead"></p>

    <div class="candle" id="candle">
      <svg viewBox="0 0 240 480" role="img" aria-label="A candle with a flame">
        <defs>
          <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffb13b" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffb13b" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="wax" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#cfc8e8"/>
            <stop offset="0.45" stop-color="#ece8f7"/>
            <stop offset="1" stop-color="#b9b1d9"/>
          </linearGradient>
        </defs>
        <circle class="glow" cx="120" cy="230" r="95" fill="url(#glowGrad)"/>
        <ellipse cx="120" cy="448" rx="78" ry="12" fill="#2b2a66"/>
        <rect x="88" y="276" width="64" height="172" rx="8" fill="url(#wax)"/>
        <ellipse cx="120" cy="277" rx="32" ry="6" fill="#f6f2fd"/>
        <rect x="118" y="262" width="4" height="18" rx="2" fill="#3a3560"/>
        <path class="smoke" d="M120 258 C 110 242 130 228 120 210" style="animation-delay:0s"/>
        <path class="smoke" d="M120 258 C 130 244 112 230 124 214" style="animation-delay:.35s"/>
        <path class="smoke" d="M120 258 C 114 246 128 236 118 220" style="animation-delay:.7s"/>
        <g transform="translate(120 264)">
          <g class="flame" id="flame">
            <g class="flame-core">
              <path d="M0 -72 C 22 -44 32 -20 18 -6 C 10 2 -10 2 -18 -6 C -32 -20 -22 -44 0 -72 Z" fill="#ffb13b"/>
              <path d="M0 -46 C 12 -28 18 -14 10 -4 C 5 1 -5 1 -10 -4 C -18 -14 -12 -28 0 -46 Z" fill="#fff1c4"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <div class="blow-wrap" id="wrap">
      <button class="btn blow" id="blow" type="button"></button>
      <div class="breath" id="breath" aria-hidden="true"></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="after" id="after" hidden>
      <a class="btn" id="open" href="hub.html"></a>
    </div>
    <a class="skip" id="skip" href="hub.html" hidden></a>
  </main>

  <script src="js/content.js"></script>
  <script src="js/core.js"></script>
  <script src="js/entrance.js"></script>
</body>
</html>
